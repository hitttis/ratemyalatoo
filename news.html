<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новости ★ RateMyAlatoo</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#20251f;--muted:#777d74;--line:#e7e6df;--green:#244b3b;--green2:#315c49;--soft:#e9eee8;--shadow:0 5px 22px rgba(29,39,31,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button{font:inherit}.top{height:68px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:5;padding:0 max(24px,calc((100% - 1240px)/2));gap:24px}.brand{font-family:Georgia,serif;font-size:23px;font-weight:bold;letter-spacing:-.6px;color:var(--green);white-space:nowrap}.brand span{color:var(--ink)}
.nav-links{display:flex;align-items:center;gap:7px;white-space:nowrap}
.nav-links a{color:#626b61;text-decoration:none;font-size:13px;padding:9px 11px;border-radius:20px;transition:background .15s,color .15s}
.nav-links a:hover{background:var(--soft);color:var(--green)}
.nav-links a[aria-current="page"]{background:var(--soft);color:var(--green);font-weight:700}
.search{margin-left:auto;width:min(440px,48vw);height:40px;border:1px solid #dcded7;border-radius:22px;background:#fafaf8;padding:0 17px;outline:none}.search:focus{border-color:var(--green)}.refresh{border:0;background:var(--green);color:white;padding:11px 17px;border-radius:22px;cursor:pointer}.wrap{max-width:1240px;margin:35px auto;padding:0 24px}.heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:25px}.eyebrow{color:var(--green2);font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:bold}.heading h1{font: bold 38px Georgia,serif;margin:7px 0 0}.sub{color:var(--muted);font-size:13px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:27px 22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(29,39,31,.10)}.thumb{width:100%;height:190px;object-fit:cover;display:block;background:#e4e7df}.thumb-fallback{height:190px;display:grid;place-items:center;background:linear-gradient(135deg,#e5e9e1,#cbd6ca);color:#496451;font:28px Georgia,serif}.cardbody{padding:17px 18px 14px}.card h2{font-size:17px;line-height:1.35;margin:0 0 10px;font-weight:700}.preview{font-size:13px;line-height:1.6;color:#666e65;margin:0;white-space:pre-line}.cardfoot{border-top:1px solid var(--line);padding:12px 17px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.like{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:#687168;cursor:pointer;padding:4px 6px;border-radius:8px}.like:hover{background:var(--soft)}.like.active{color:var(--green);font-weight:bold}.like svg{width:17px;height:17px}.last-label{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--green);font-weight:bold;background:var(--soft);padding:6px 9px;border-radius:20px}.status{padding:35px 15px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;grid-column:1/-1}.status.error{color:#9c453b}.modal{position:fixed;inset:0;background:rgba(13,20,16,.68);display:none;align-items:center;justify-content:center;padding:22px;z-index:10}.modal.open{display:flex}.dialog{width:min(820px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:15px;box-shadow:0 20px 70px #0005}.dialog img{width:100%;max-height:390px;object-fit:cover;display:block;background:#e4e7df}.dialog-content{padding:26px 30px 30px}.dialog h2{font: bold 29px/1.25 Georgia,serif;margin:0 0 17px}.fulltext{font-size:15px;line-height:1.8;color:#454d45;white-space:pre-wrap;overflow-wrap:anywhere}.dialog-actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:17px;border-top:1px solid var(--line)}.close{border:1px solid var(--line);background:transparent;border-radius:22px;padding:9px 15px;cursor:pointer}.notice{font-size:11px;color:var(--muted);margin-top:26px;text-align:center}.footer{border-top:1px solid var(--line);margin-top:55px;padding:24px;text-align:center;color:var(--muted);font-size:12px}
.bottom-nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:8;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;width:min(560px,calc(100% - 28px));padding:8px;background:rgba(255,255,255,.97);border:1px solid #e5e5dc;border-radius:16px;box-shadow:0 8px 30px rgba(29,39,31,.14);backdrop-filter:blur(12px)}.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:53px;color:#777d74;text-decoration:none;font-size:11px;font-weight:500;border-radius:11px;transition:background .15s,color .15s}.bottom-nav a:hover,.bottom-nav a[aria-current="page"]{color:var(--green);background:var(--soft)}.bottom-nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.bottom-nav a[aria-current="page"] span{font-weight:700}.wrap{padding-bottom:100px}.footer{padding-bottom:110px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.thumb,.thumb-fallback{height:175px}}
@media(max-width:600px){.top{height:auto;min-height:60px;padding:10px 14px;gap:8px;flex-wrap:wrap}.brand{font-size:19px}.search{flex:1;width:auto;min-width:0;margin-left:auto}.refresh{padding:10px 12px;font-size:12px}.bottom-nav{bottom:10px;padding:6px}.bottom-nav a{min-height:49px;font-size:10px}.wrap{margin:25px auto;padding:0 14px}.heading h1{font-size:32px}.grid{grid-template-columns:1fr;gap:17px}.thumb,.thumb-fallback{height:205px}.dialog-content{padding:21px 18px}.dialog h2{font-size:24px}}
</style>
</head>
<body>
<header class="top">
<div class="brand">RateMy<span>Alatoo</span></div>
<input class="search" id="search" placeholder="Поиск новостей…" aria-label="Поиск новостей">
<button class="refresh" id="refresh">Обновить</button>
</header>
<main class="wrap"><div class="heading"><div><div class="eyebrow">Новости университета</div><h1>Последние новости</h1><div class="sub">Главное о жизни университета — в одном месте</div></div></div><section class="grid" id="newsGrid"><div class="status"></div></section><div class="notice"></div></main>
<nav class="bottom-nav" aria-label="Основная навигация">
<a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Главная</span></a>
<a href="schedule.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9h18M8 13h2M14 13h2M8 17h2"/></svg><span>Расписание</span></a>
<a href="app.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 11a3 3 0 1 0-1-5.8M18 14a5 5 0 0 1 3.5 5"/></svg><span>Преподаватели</span></a>
<a href="news.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"/></svg><span>Ещё</span></a>
</nav>
<footer class="footer">RateMyAlatoo · Новости</footer>
<div class="modal" id="modal" role="dialog" aria-modal="true"><article class="dialog"><img id="modalImage" alt=""><div class="dialog-content"><h2 id="modalTitle"></h2><div class="fulltext" id="modalText"></div><div class="dialog-actions"><button class="like" id="modalLike"></button><button class="close" id="closeModal">Закрыть</button></div></div></article></div>
<script>
(() => {
 const SHEET_ID='1rmFxyMwWyz0KhWe9mssbf8jy2zy1NGK0-p6eBDTegS0';
 const GID='0'; 
 const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
 const grid=document.getElementById('newsGrid'), search=document.getElementById('search');
 let articles=[], activeArticle=null;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++;}else if(c==='"'){quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';}else cell+=c;}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows;}
 function sentencePreview(text){const clean=String(text||'').trim();if(!clean)return '';const sentences=clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[clean];return sentences.slice(0,7).join(' ').trim();}
 function readLikes(id,base){const saved=JSON.parse(localStorage.getItem('ratemyalatoo_news_likes')||'{}');return Math.max(0,(Number(base)||0)+(saved[id]?1:0));}
 function liked(id){const saved=JSON.parse(localStorage.getItem('ratemyalatoo_news_likes')||'{}');return !!saved[id];}
 function toggleLike(id){const saved=JSON.parse(localStorage.getItem('ratemyalatoo_news_likes')||'{}');saved[id]=!saved[id];localStorage.setItem('ratemyalatoo_news_likes',JSON.stringify(saved));render(search.value);if(activeArticle?.id===id)updateModalLike(activeArticle);}
 function likeButton(a){return `<button class="like ${liked(a.id)?'active':''}" data-like="${esc(a.id)}" aria-label="Нравится">${liked(a.id)?'♥':'♡'} <span>${readLikes(a.id,a.likes)}</span></button>`;}
 function render(filter=''){const q=filter.trim().toLowerCase();const visible=articles.filter(a=>(a.title+' '+a.text).toLowerCase().includes(q));if(!visible.length){grid.innerHTML=`<div class="status">${articles.length?'По вашему запросу ничего не найдено.':'Пока нет опубликованных новостей.'}</div>`;return;}grid.innerHTML=visible.map((a,i)=>{const isLast=articles.length&&a.id===articles[articles.length-1].id;return `<article class="card" data-open="${esc(a.id)}">${a.image?`<img class="thumb" src="${esc(a.image)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;thumb-fallback&quot;>RateMyAlatoo</div>'">`:`<div class="thumb-fallback">RateMyAlatoo</div>`}<div class="cardbody"><h2>${esc(a.title)}</h2><p class="preview">${esc(sentencePreview(a.text))}${a.text.length>sentencePreview(a.text).length?'…':''}</p></div><div class="cardfoot"><span>${isLast?'<span class="last-label">Последняя новость</span>':'Читать новость'}</span>${likeButton(a)}</div></article>`;}).join('');}
 function openArticle(id){activeArticle=articles.find(a=>a.id===id);if(!activeArticle)return;document.getElementById('modalTitle').textContent=activeArticle.title;document.getElementById('modalText').textContent=activeArticle.text;const img=document.getElementById('modalImage');img.src=activeArticle.image||'';img.style.display=activeArticle.image?'block':'none';updateModalLike(activeArticle);document.getElementById('modal').classList.add('open');}
 function updateModalLike(a){const b=document.getElementById('modalLike');b.className='like '+(liked(a.id)?'active':'');b.innerHTML=`${liked(a.id)?'♥':'♡'} <span>${readLikes(a.id,a.likes)}</span>`;b.onclick=()=>toggleLike(a.id);}
 async function load(){grid.innerHTML='<div class="status"></div>';try{const response=await fetch(CSV_URL,{cache:'no-store'});if(!response.ok)throw new Error('Google Sheets вернул ошибку '+response.status);const rows=parseCSV(await response.text());if(!rows.length)throw new Error('Таблица пуста.');const first=rows[0].map(x=>x.toLowerCase().trim());const hasHeader=first.some(x=>/назван|заголов|title|фото|image|данн|текст|лайк|like/.test(x));const data=hasHeader?rows.slice(1):rows;articles=data.map((r,i)=>({id:'news_'+i+'_'+(r[0]||'').slice(0,30),title:(r[0]||'').trim(),image:(r[1]||'').trim(),text:(r[2]||'').trim(),likes:parseInt(String(r[3]||'0').replace(/[^0-9-]/g,''),10)||0})).filter(a=>a.title||a.text);if(!articles.length)throw new Error('Не удалось найти строки с новостями. Проверьте порядок столбцов: заголовок, ссылка на фото, текст, лайки.');render(search.value);}catch(e){grid.innerHTML=`<div class="status error">Не удалось загрузить новости. Проверьте, что Google Таблица открыта для просмотра всем, у кого есть ссылка, и что вкладка с новостями имеет gid=${GID}.<br><br>${esc(e.message)}<br><br><a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit" target="_blank" rel="noopener">Открыть таблицу</a></div>`;}}
 grid.addEventListener('click',e=>{const like=e.target.closest('[data-like]');if(like){e.stopPropagation();toggleLike(like.dataset.like);return;}const card=e.target.closest('[data-open]');if(card)openArticle(card.dataset.open);});
 search.addEventListener('input',()=>render(search.value));document.getElementById('refresh').addEventListener('click',load);document.getElementById('closeModal').addEventListener('click',()=>document.getElementById('modal').classList.remove('open'));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open');});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').classList.remove('open');});load();
})();
</script>
</body></html>
